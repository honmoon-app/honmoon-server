# Publishes the image self-hosters actually run.
#
# Lives at server/.github/ in the monorepo and lands at the repo root when
# server/ is extracted into the public honmoon-app/honmoon-server repo, which
# is the only place GitHub reads workflows from.
#
# Order matters: build amd64 → smoke test → only then push. A broken :latest
# is worse than no :latest, because everyone's `docker compose pull` picks it
# up. Unit tests (cargo test) stay local — CI checks the assembled image.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          # Tagged as the published name so docker-compose.selfhost.yml picks
          # up this build instead of pulling — the smoke test then exercises
          # the exact compose file self-hosters are handed.
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: HONMOON_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          pip install --quiet websockets
          docker compose -f docker-compose.selfhost.yml up -d
          for _ in $(seq 30); do
            curl -fsS http://localhost:8080/health && break || sleep 2
          done
          python3 scripts/smoke_test.py http://localhost:8080

      - name: Server logs on failure
        if: failure()
        run: docker compose -f docker-compose.selfhost.yml logs

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is here for the Raspberry Pi / old-mini-PC crowd, which is
          # most of the point of self-hosting.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: HONMOON_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
